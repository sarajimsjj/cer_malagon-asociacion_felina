spring.datasource.url=jdbc:postgresql://localhost:5432/cer_malagon_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Secreto para firmar los JWT (cadena aleatoria de 32+ caracteres). Genera uno con, p.ej.:
# openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:1440}

# Solo se usan la primera vez que arranca la app (si no hay ninguna administradora todavia).
# A partir de ahi, las nuevas administradoras se crean desde la propia aplicacion.
app.admin-inicial.usuario=${ADMIN_INICIAL_USUARIO:}
app.admin-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}

# Fotos y vídeos de gatos: se guardan en disco local por ahora (gratis, sin cuenta de AWS
# que configurar). Si en el futuro se migra a S3 u otro proveedor, solo cambia lo que se
# guarda en la columna "url" de gato_fotos; el resto de la aplicación no se entera.
# 50MB por si acaso da para un vídeo corto; ajusta si hace falta más (o menos, para no
# llenar el disco).
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB