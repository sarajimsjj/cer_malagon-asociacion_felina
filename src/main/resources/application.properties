# En local apunta a tu Postgres de siempre. En producción, sustitúyela por la URL JDBC
# de tu base de datos (ej. Neon): jdbc:postgresql://<host>/<bd>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cer_malagon_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Render (y la mayoría de plataformas) asignan el puerto por variable de entorno;
# en local, si no está definida, sigue usando el 8080 de siempre.
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Secreto para firmar los JWT (cadena aleatoria de 32+ caracteres). Genera uno con, p.ej.:
# openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:1440}

# Solo se usan la primera vez que arranca la app (si no hay ninguna administradora todavia).
# A partir de ahi, las nuevas administradoras se crean desde la propia aplicacion.
app.admin-inicial.usuario=${ADMIN_INICIAL_USUARIO:}
app.admin-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}

# Fotos y vídeos de gatos: se guardan en un bucket de Amazon S3. Las credenciales
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) las coge el SDK de AWS directamente del
# entorno, no pasan por esta configuración ni por el código de la aplicación.
app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.region=${AWS_S3_REGION}

# 50MB por si acaso da para un vídeo corto; ajusta si hace falta más (o menos).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# En local, cualquier puerto de localhost. En producción, añade aquí el dominio real
# del frontend (varios separados por comas si hace falta), ej.:
# CORS_ALLOWED_ORIGINS=https://cer-malagon.netlify.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}